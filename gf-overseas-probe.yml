name: gf-overseas-probe
on:
  push:
    paths:
      - 'gf-overseas-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '' | base64 -d > /tmp/overseas-probe.py
          python3 /tmp/overseas-probe.py > probe-results.txt 2>&1 || true
          git config user.email "action@github.com"
          git config user.name "gf-overseas-probe"
          git add probe-results.txt
          git commit -m "gf-overseas-probe results [skip ci]"
          git push
